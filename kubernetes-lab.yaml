apiVersion: v1
kind: Namespace
metadata:
  name: tp-kubernetes
  labels:
    app.kubernetes.io/part-of: portal-academico
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  namespace: tp-kubernetes
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: portal-academico
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      gzip off;

      map $http_accept $portal_destination {
        default "plain";
        "~*text/html" "html";
      }

      server {
        listen 8080;
        server_tokens off;
        keepalive_timeout 0;
        keepalive_requests 1;

        # Navegador: página. curl y make requests: texto con el nombre del Pod.
        location / {
          if ($portal_destination = "html") {
            rewrite ^ /_portal last;
          }

          default_type text/plain;
          add_header Cache-Control "no-store" always;
          add_header Vary "Accept" always;
          return 200 "Portal academico - ASI 2026\nPod: $hostname\n";
        }

        location = /_portal {
          internal;
          root /etc/nginx;
          rewrite ^ /portal.html break;
          default_type text/html;
          charset utf-8;
          sendfile off;
          sub_filter_once on;
          sub_filter "__POD__" "$hostname";
          add_header Cache-Control "no-store" always;
          add_header Vary "Accept" always;
        }

        location = /healthz {
          default_type text/plain;
          access_log off;
          return 200 "ok\n";
        }
      }
    }
  portal.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Portal académico, ASI 2026</title>
      <meta name="description" content="El Service reparte cada pedido y esta página muestra qué Pod lo atendió.">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
        /* Hallmark · shape: app screen · genre: modern-minimal · theme: Console (deal 2/3, seed classroom-instrument-shows-which-46ec·00a65039·2026-11-02·r0) · redesign: full
         * nav: top bar, the name and the year, no links · signature: the live Pod hostname as a measured reading · states: idle, loading, error, full · footer: paper-3 definition line · console: graphite
         * axes: dark/grotesk-sans/chromatic-amber · posture: restrained · contrast: pass · v2.0.0 */
        /* Hallmark · pre-emit critique: P4 H5 E4 S4 R4 V5 · weakest: S, a graphite console could be any lab; the reading is this Pod hostname and the bars count only this action */
        /* Hallmark · hero-review: skipped, app screen · finish-review: subagent · 0 findings · gap: none */
        :root {
          color-scheme: dark;
          --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
          --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem;
          --text-display-s: 1.44rem; --text-display: 1.728rem; --text-section: 1.2rem; --text-title: 1rem; --text-lead: 1rem;
          --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
          --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
          --color-error: oklch(72% 0.15 27); --color-success: oklch(76% 0.13 150);
          --container: 1440px; --gutter: 64px; --gap-columns: 32px; --section-gap-s: 120px; --section-gap: 144px; --section-gap-l: 176px;
          --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400; --z-toast: 500; --z-tooltip: 600;
          --color-paper: oklch(17% 0.008 250); --color-paper-2: oklch(21% 0.009 250); --color-paper-3: oklch(13.5% 0.007 250);
          --color-ink: oklch(95% 0.005 250); --color-ink-2: oklch(83% 0.008 250); --color-muted: oklch(71% 0.01 250);
          --color-rule: oklch(31% 0.01 250); --color-rule-2: oklch(42% 0.012 250);
          --color-accent: oklch(82% 0.15 80); --color-accent-ink: oklch(18% 0.04 75); --color-accent-soft: oklch(29% 0.05 80); --color-focus: oklch(82% 0.15 80);
          --color-cool: oklch(77% 0.12 245); --color-cool-soft: oklch(29% 0.05 245);
          --color-ok: oklch(76% 0.15 150); --color-ok-soft: oklch(24.5% 0.03 150); --color-bad: oklch(70% 0.17 25); --color-bad-soft: oklch(24.5% 0.035 25);
          --font-display: "Host Grotesk", ui-sans-serif, system-ui, sans-serif; --font-body: var(--font-display);
          --font-outlier: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
          --radius-card: 10px; --radius-pill: 6px; --rule-hair: 1px;
          --shadow-card: none;
          --tracking-display: -0.03em; --tracking-reading: -0.04em; --display-weight: 500;
          --control-h: 40px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { overflow-x: clip; }
        html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }
        body {
          margin: 0;
          background: var(--color-paper);
          color: var(--color-ink);
          font-family: var(--font-body);
          font-size: var(--text-md);
          font-weight: 400;
          font-synthesis: none;
          line-height: 1.55;
          caret-color: var(--color-accent);
        }
        ::selection { background: color-mix(in oklab, var(--color-accent) 25%, transparent); color: var(--color-ink); }
        :focus-visible { outline: 2px solid var(--color-focus); outline-offset: var(--space-3xs); }
        h1, h2 {
          margin: 0;
          font-family: var(--font-display);
          font-weight: var(--display-weight);
          font-synthesis: none;
          letter-spacing: var(--tracking-display);
          line-height: 1.04;
          overflow-wrap: break-word;
          min-width: 0;
          text-wrap: balance;
        }
        h1 { max-width: 20ch; font-size: var(--text-xl); }
        h2 { max-width: 30ch; font-size: var(--text-section); line-height: 1.2; }
        p { margin: 0; text-wrap: pretty; }
        .container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }

        .bar { border-bottom: var(--rule-hair) solid var(--color-rule); }
        .bar-inner {
          display: flex;
          justify-content: space-between;
          align-items: end;
          gap: var(--space-lg);
          padding-block: var(--space-lg);
        }
        .lead {
          margin-top: var(--space-xs);
          max-width: 65ch;
          color: var(--color-ink-2);
        }
        .course {
          margin: 0;
          color: var(--color-muted);
          font-size: var(--text-sm);
          font-weight: 500;
        }

        .sheet { padding-block: var(--space-xl) var(--space-2xl); }
        .reading-row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: var(--space-lg);
          align-items: end;
        }
        figure { margin: 0; min-width: 0; }
        .reading {
          font-family: var(--font-outlier);
          font-size: var(--text-3xl);
          font-weight: 400;
          line-height: 1.05;
          letter-spacing: var(--tracking-reading);
          color: var(--color-ink);
          font-variant-numeric: tabular-nums slashed-zero;
          overflow-wrap: break-word;
          min-width: 0;
        }
        figcaption {
          margin-top: var(--space-xs);
          max-width: 36ch;
          color: var(--color-muted);
          font-size: var(--text-sm);
          font-weight: 500;
        }

        .actions {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: flex-end;
          gap: var(--space-sm);
          max-width: 28rem;
        }
        .btn {
          font: inherit;
          font-weight: 500;
          font-size: var(--text-md);
          line-height: 1;
          min-height: var(--control-h);
          padding: 0 var(--space-md);
          border: var(--rule-hair) solid var(--color-rule-2);
          border-radius: var(--radius-pill);
          background: var(--color-paper-2);
          color: var(--color-ink);
          white-space: nowrap;
          cursor: pointer;
          transition: background-color var(--dur-short) var(--ease-out);
        }
        .btn--primary {
          background: var(--color-accent);
          border-color: var(--color-accent);
          color: var(--color-accent-ink);
        }
        .btn:hover { background: var(--color-paper-3); }
        .btn--primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: var(--space-3xs); }
        .btn:disabled,
        .btn:disabled:hover {
          opacity: 0.55;
          cursor: not-allowed;
          transform: none;
        }
        .btn[aria-busy="true"] { cursor: progress; }
        .progress {
          flex-basis: 100%;
          min-height: 1lh;
          margin: 0;
          color: var(--color-muted);
          font-variant-numeric: tabular-nums;
          text-align: right;
        }
        .progress.is-error { color: var(--color-bad); }

        .ledger-section { margin-top: var(--space-2xl); }
        .section-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: var(--space-md);
          margin-bottom: var(--space-sm);
        }
        #caption {
          color: var(--color-ink-2);
          font-size: var(--text-sm);
          font-weight: 500;
        }
        .ledger { min-width: 0; }
        .row {
          display: grid;
          grid-template-columns: minmax(12rem, 22rem) minmax(0, 1fr) auto;
          gap: var(--space-sm);
          align-items: center;
          padding-block: var(--space-xs);
          padding-inline: var(--space-sm);
          border-top: var(--rule-hair) solid var(--color-rule);
        }
        .row.current {
          background: var(--color-paper-3);
          color: var(--color-ink);
        }
        .name {
          min-width: 0;
          font-family: var(--font-outlier);
          font-size: var(--text-md);
          font-weight: 400;
          font-variant-numeric: tabular-nums slashed-zero;
          overflow-wrap: break-word;
        }
        .track {
          display: block;
          height: var(--space-sm);
          background: var(--color-rule);
          overflow: hidden;
        }
        .fill {
          display: block;
          height: 100%;
          width: 100%;
          background: var(--color-cool);
          transform: scaleX(0);
          transform-origin: left center;
          border-radius: 0 var(--space-3xs) var(--space-3xs) 0;
          transition: transform var(--dur-short) var(--ease-out);
        }
        .count {
          font-family: var(--font-outlier);
          font-size: var(--text-md);
          font-weight: 500;
          font-variant-numeric: tabular-nums slashed-zero;
          text-align: right;
        }
        .hint {
          margin-top: var(--space-sm);
          max-width: 65ch;
          color: var(--color-muted);
          font-size: var(--text-sm);
        }

        .record {
          background: var(--color-paper-3);
          color: var(--color-ink);
        }
        .record .container { padding-block: var(--space-lg); }
        .facts {
          display: flex;
          flex-wrap: wrap;
          gap: var(--space-lg) var(--space-2xl);
          margin: 0;
        }
        .facts dt {
          font-size: var(--text-sm);
          font-weight: 500;
          color: var(--color-muted);
        }
        .facts dd {
          margin: var(--space-2xs) 0 0;
          font-family: var(--font-outlier);
          font-size: var(--text-md);
          font-weight: 400;
          font-variant-numeric: tabular-nums slashed-zero;
        }

        @media (max-width: 60rem) {
          :root { --gutter: var(--space-lg); }
        }
        @media (max-width: 40rem) {
          :root { --gutter: var(--space-md); }
          .bar-inner, .reading-row { display: block; }
          .course, .actions { margin-top: var(--space-lg); }
          .actions { justify-content: flex-start; }
          .progress { text-align: left; }
          .facts { display: block; }
          .facts div + div { margin-top: var(--space-md); }
          .row { grid-template-columns: minmax(0, 1fr) auto; }
          .track { grid-column: 1 / -1; }
        }
        @media (prefers-reduced-motion: reduce) {
          .fill, .btn { transition: none; }
        }
      </style>
    </head>
    <body>
      <header class="bar">
        <div class="container bar-inner">
          <div>
            <h1>Portal académico</h1>
            <p class="lead">El Service reparte cada pedido entre los Pods.</p>
          </div>
          <p class="course"><time datetime="2026">ASI 2026</time></p>
        </div>
      </header>
      <main>
        <div class="container sheet">
          <div class="reading-row">
            <figure>
              <p id="pod" class="reading">__POD__</p>
              <figcaption>Esta respuesta la atendió</figcaption>
            </figure>
            <div class="actions">
              <button type="button" class="btn btn--primary" id="once">Nueva solicitud</button>
              <button type="button" class="btn" id="burst">Ráfaga × 20</button>
              <p id="progress" class="progress" role="status"></p>
            </div>
          </div>
          <section class="ledger-section" aria-labelledby="reparto-title">
            <div class="section-head">
              <h2 id="reparto-title">Reparto</h2>
              <p id="caption">Carga inicial</p>
            </div>
            <div id="bars" class="ledger" aria-busy="false"></div>
            <p class="hint">Cada barra es un Pod. Crece con las respuestas que atendió en esta acción.</p>
          </section>
        </div>
      </main>
      <footer class="record">
        <div class="container">
          <dl class="facts">
            <div><dt>Namespace</dt><dd>tp-kubernetes</dd></div>
            <div><dt>Service</dt><dd>portal</dd></div>
            <div><dt>Deployment</dt><dd>portal</dd></div>
          </dl>
        </div>
      </footer>
      <script>
        (function () {
          "use strict";

          var podEl = document.getElementById("pod");
          var captionEl = document.getElementById("caption");
          var barsEl = document.getElementById("bars");
          var progressEl = document.getElementById("progress");
          var onceBtn = document.getElementById("once");
          var burstBtn = document.getElementById("burst");
          var counts = {};
          var goal = 1;
          var busy = false;

          function setBusy(value) {
            busy = value;
            onceBtn.disabled = value;
            burstBtn.disabled = value;
            onceBtn.setAttribute("aria-busy", value ? "true" : "false");
            burstBtn.setAttribute("aria-busy", value ? "true" : "false");
            barsEl.setAttribute("aria-busy", value ? "true" : "false");
          }

          function clearError() {
            progressEl.classList.remove("is-error");
          }

          function showError(message) {
            progressEl.textContent = message;
            progressEl.classList.add("is-error");
          }

          function showPod(name) {
            podEl.textContent = name;
          }

          function findRow(name) {
            return barsEl.querySelector('[data-pod="' + CSS.escape(name) + '"]');
          }

          function buildRow(name) {
            var row = document.createElement("div");
            var nameEl = document.createElement("span");
            var text = document.createElement("span");
            var track = document.createElement("span");
            var fill = document.createElement("span");
            var count = document.createElement("span");

            row.className = "row";
            row.dataset.pod = name;
            nameEl.className = "name";
            text.className = "n";
            text.textContent = name;
            nameEl.append(text);
            track.className = "track";
            track.setAttribute("aria-hidden", "true");
            fill.className = "fill";
            track.append(fill);
            count.className = "count";
            row.append(nameEl, track, count);
            return row;
          }

          function renderBars(current) {
            var names = Object.keys(counts).sort();
            var i;
            var name;
            var row;
            var percent;

            for (i = 0; i < names.length; i += 1) {
              name = names[i];
              row = findRow(name);
              if (!row) {
                row = buildRow(name);
                barsEl.appendChild(row);
              }
              percent = Math.round((counts[name] / goal) * 100);
              row.querySelector(".fill").style.transform = "scaleX(" + (percent / 100) + ")";
              row.querySelector(".count").textContent = String(counts[name]);
              row.classList.toggle("current", name === current);
            }

            for (i = 0; i < names.length; i += 1) {
              row = findRow(names[i]);
              if (row) {
                barsEl.appendChild(row);
              }
            }

            Array.prototype.slice.call(barsEl.children).forEach(function (child) {
              if (!counts[child.dataset.pod]) {
                child.remove();
              }
            });
          }

          function record(name) {
            counts[name] = (counts[name] || 0) + 1;
            showPod(name);
            renderBars(name);
          }

          function resetCounts() {
            counts = {};
            barsEl.textContent = "";
          }

          function ask() {
            var url = "/?r=" + Date.now() + "-" + Math.random().toString(16).slice(2);
            return fetch(url, {
              cache: "no-store",
              headers: {
                "Accept": "text/plain",
                "Cache-Control": "no-cache"
              }
            }).then(function (response) {
              if (!response.ok) {
                throw new Error(String(response.status));
              }
              return response.text();
            }).then(function (text) {
              var match = text.match(/Pod:\s*(\S+)/);
              if (!match) {
                throw new Error("respuesta");
              }
              return match[1];
            });
          }

          function once() {
            if (busy) {
              return Promise.resolve();
            }
            setBusy(true);
            captionEl.textContent = "Última solicitud";
            progressEl.textContent = "";
            clearError();
            goal = 1;
            resetCounts();
            return ask().then(function (name) {
              record(name);
            }).catch(function () {
              showError("No se pudo consultar el portal.");
            }).then(function () {
              setBusy(false);
            });
          }

          function burst() {
            var n;
            if (busy) {
              return;
            }
            setBusy(true);
            captionEl.textContent = "Ráfaga de 20";
            progressEl.textContent = "0 de 20";
            clearError();
            goal = 20;
            resetCounts();

            n = 0;
            function step() {
              n += 1;
              progressEl.textContent = n + " de 20";
              return ask().then(function (name) {
                record(name);
                if (n < 20) {
                  return new Promise(function (resolve) {
                    requestAnimationFrame(function () { resolve(); });
                  }).then(step);
                }
              });
            }

            step().catch(function () {
              showError("La ráfaga se interrumpió.");
            }).then(function () {
              setBusy(false);
            });
          }

          onceBtn.addEventListener("click", once);
          burstBtn.addEventListener("click", burst);

          var initial = (podEl.textContent || "").trim();
          if (initial && initial !== "__POD__" && initial.indexOf("<") === -1) {
            goal = 1;
            record(initial);
          }
        })();
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: tp-kubernetes
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: portal-academico
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
        app.kubernetes.io/name: portal
        app.kubernetes.io/part-of: portal-academico
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/portal.html
              subPath: portal.html
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: portal-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: tp-kubernetes
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: portal-academico
spec:
  type: NodePort
  selector:
    app: portal
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
